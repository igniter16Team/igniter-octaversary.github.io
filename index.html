<!DOCTYPE html>
<html>
<head>
  <title>Igniter Octaversary</title>
  <style>
    .slide { display: none; text-align: center; margin-top: 100px; font-size: 24px; }
    .active { display: block; }
    input, button { font-size: 18px; padding: 10px; }
  </style>
</head>
<body>

<div id="slide1" class="slide active">
  <h1>Enter your unique code</h1>
  <input id="textInput" placeholder="Type your unique ID">
</div>

<div id="slideGeneral" class="slide">
  <p>Happy Anniversary 8th Igniter</p>
  <p>with Almost 1 decade being together</p>
  <button onclick="goToUniqueSlide()">Continue</button>
</div>

<div id="slideUnique" class="slide">
  <h2 id="title"></h2>
  <p id="message"></p>
</div>

<script>
let jsonData = {};
let selectedKey = "";

fetch("datatest.json")
  .then(res => res.json())
  .then(data => jsonData = data);

const input = document.getElementById("textInput");

input.addEventListener("change", function () {
  const value = input.value.trim();

  if (jsonData[value]) {
    selectedKey = value;
    showSlide("slideGeneral"); // Slide 2
  } else {
    alert("ID not found!");
  }
});

function goToUniqueSlide() {
  const data = jsonData[selectedKey];

  document.getElementById("title").innerText = data.title;
  document.getElementById("message").innerText = data.message;

  showSlide("slideUnique"); // Slide 3 (template)
}

function showSlide(id) {
  document.querySelectorAll(".slide").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}
</script>


</body>
</html>
