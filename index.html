<!DOCTYPE html>
<html>
<head>
  <title>Dynamic Slide from JSON</title>
  <style>
    .slide { display: none; text-align: center; margin-top: 100px; font-size: 24px; }
    .active { display: block; }
    input, button { font-size: 18px; padding: 10px; }
  </style>
</head>
<body>

<div id="slide1" class="slide active">
  <p>Type a keyword:</p>
  <input type="text" id="userInput" placeholder="happy or birthday">
  <br><br>
  <button onclick="goToGeneral()">Next</button>
</div>

<div id="slide2" class="slide">
  <p>General Slide</p>
  <button onclick="goToUnique()">Continue</button>
</div>

<div id="slide3" class="slide">
  <h2 id="title"></h2>
  <p id="message"></p>
</div>

<script>
  let typedKey = "";
  let jsonData = {};

  fetch("data.json")
    .then(res => res.json())
    .then(data => jsonData = data);

  function goToGeneral() {
    typedKey = document.getElementById("userInput").value.toLowerCase();
    if (!jsonData[typedKey]) {
      alert("Keyword not found in JSON!");
      return;
    }
    showSlide("slide2");
  }

  function goToUnique() {
    const content = jsonData[typedKey];
    document.getElementById("title").innerText = content.title;
    document.getElementById("message").innerText = content.message;
    showSlide("slide3");
  }

  function showSlide(id) {
    document.querySelectorAll(".slide").forEach(s => s.classList.remove("active"));
    document.getElementById(id).classList.add("active");
  }
</script>

</body>
</html>
